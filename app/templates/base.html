<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12355b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{% block title %}jobRadar{% endblock %}</title>
    <link rel="stylesheet" href="/static/admin.css">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/admin">jobRadar</a>
      <nav aria-label="관리 메뉴">
        <a href="/admin/jobs">공고</a>
        <a href="/admin/sources">소스</a>
        <a href="/admin/keywords">키워드</a>
        <a href="/admin/notifications">알림</a>
      </nav>
      <form method="post" action="/logout"><button class="text-button" type="submit">로그아웃</button></form>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
    {% block scripts %}{% endblock %}
  </body>
</html>
