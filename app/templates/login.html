<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jobRadar 로그인</title>
    <link rel="stylesheet" href="/static/admin.css">
  </head>
  <body class="login-page">
    <main class="login-card">
      <p class="eyebrow">JOB RADAR</p>
      <h1>관리자 로그인</h1>
      {% if not auth_configured %}
      <p class="notice error">관리자 비밀번호 해시가 설정되지 않았습니다.</p>
      {% elif error %}
      <p class="notice error">{{ error }}</p>
      {% endif %}
      <form method="post" action="/login" class="stack">
        <input type="hidden" name="next" value="{{ next }}">
        <label>아이디<input name="username" autocomplete="username" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit" {% if not auth_configured %}disabled{% endif %}>로그인</button>
      </form>
    </main>
  </body>
</html>
