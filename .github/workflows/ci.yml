name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_BASE_URL: https://example.com
      SECRET_KEY: ci-test-secret
      DATABASE_URL: postgresql+psycopg://jobradar:jobradar@127.0.0.1:5432/jobradar
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # .python-version(3.12)을 uv가 읽어 배포 환경과 같은 버전으로 맞춘다
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
